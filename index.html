<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>GOLD RATE | 金買取相場シミュレーター</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Segoe UI",sans-serif;background:#0b0f14;color:#f7f7f7}
    .wrap{max-width:760px;margin:auto;padding:20px 16px 48px}
    .hero{padding:18px 4px 22px}
    .eyebrow{font-size:12px;letter-spacing:.18em;color:#d6ad55;font-weight:800}
    h1{margin:6px 0 4px;font-size:32px;letter-spacing:.06em}
    .sub{color:#aab1bb;font-size:14px}
    .card{background:#141a22;border:1px solid #27303b;border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
    .price-card{background:linear-gradient(145deg,#1a2029,#10151c);border-color:#4b3b1c}
    .label{color:#aab1bb;font-size:13px}
    .price{font-size:46px;line-height:1.05;font-weight:900;margin:7px 0;color:#e7c36a}
    .unit{font-size:17px;color:#d9dde3;font-weight:700}
    .updated{font-size:12px;color:#929aa6;margin-top:10px}
    .source{display:inline-block;margin-top:12px;color:#e7c36a;text-decoration:none;font-size:13px;font-weight:700}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field label{display:block;font-size:13px;color:#aab1bb;margin-bottom:7px}
    select,input{width:100%;border:1px solid #343e4b;background:#0e1319;color:#fff;border-radius:12px;padding:14px;font-size:18px;outline:none}
    .calc{margin-top:16px;border-radius:16px;background:#0e1319;padding:17px;border:1px solid #29323d}
    .calc-title{font-size:13px;color:#aab1bb}
    .calc-price{font-size:31px;font-weight:900;margin-top:4px}
    .breakdown{margin-top:12px;display:grid;gap:7px;font-size:13px;color:#b9c0ca}
    .row{display:flex;justify-content:space-between;gap:12px}
    .row strong{color:#fff}
    .notice{font-size:12px;color:#8f98a4;line-height:1.7;margin-top:14px}
    .error{color:#ff9a9a}
    @media(max-width:560px){h1{font-size:27px}.price{font-size:39px}.grid{grid-template-columns:1fr}.calc-price{font-size:28px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">GOLD RATE</div>
    <h1>金買取相場シミュレーター</h1>
    <div class="sub">今日の金相場を基準に、売却額の目安をすぐ計算</div>
  </header>

  <section class="card price-card">
    <div class="label">田中貴金属・金 店頭買取価格（税込）</div>
    <div><span id="basePrice" class="price">--</span><span class="unit"> 円 / g</span></div>
    <div id="updated" class="updated">価格を読み込み中…</div>
    <a class="source" href="https://gold.tanaka.co.jp/commodity/souba/index.php" target="_blank" rel="noopener">公式価格を確認 →</a>
  </section>

  <section class="card">
    <div class="grid">
      <div class="field">
        <label for="purity">金の純度</label>
        <select id="purity">
          <option value="1">K24（純金）</option>
          <option value="0.916">K22</option>
          <option value="0.833">K20</option>
          <option value="0.750">K18</option>
          <option value="0.585">K14</option>
          <option value="0.417">K10</option>
          <option value="0.375">K9</option>
        </select>
      </div>
      <div class="field">
        <label for="weight">重さ</label>
        <input id="weight" type="number" value="10" min="0" step="0.01" inputmode="decimal">
      </div>
    </div>

    <div class="calc">
      <div class="calc-title">買取額の目安</div>
      <div id="total" class="calc-price">-- 円</div>
      <div class="breakdown">
        <div class="row"><span>純度換算 1g単価</span><strong id="unitPrice">-- 円</strong></div>
        <div class="row"><span>重量</span><strong id="weightView">10 g</strong></div>
        <div class="row"><span>計算方法</span><strong>相場 × 純度 × 重量</strong></div>
      </div>
    </div>
    <div class="notice">
      ※これは田中貴金属の金地金「店頭買取価格」を基準にした概算です。実際の買取額は品位確認、商品状態、手数料、店舗・サービス条件などにより異なる場合があります。<br>
      ※田中貴金属の地金価格は営業日の9:30と14:00に公表され、相場等により同日内に変更される場合があります。
    </div>
  </section>
</div>

<script>
let data = null;
const yen = n => Number.isFinite(n) ? Math.floor(n).toLocaleString("ja-JP") : "--";

function calculate(){
  if(!data || !data.tanaka_buy) return;
  const purity = Number(document.getElementById("purity").value);
  const weight = Math.max(0, Number(document.getElementById("weight").value) || 0);
  const unit = Math.floor(data.tanaka_buy * purity);
  const total = Math.floor(unit * weight);
  document.getElementById("unitPrice").textContent = yen(unit) + " 円";
  document.getElementById("weightView").textContent = weight + " g";
  document.getElementById("total").textContent = yen(total) + " 円";
}

async function load(){
  try{
    const res = await fetch("prices.json?ts=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("prices.json");
    data = await res.json();
    document.getElementById("basePrice").textContent = yen(data.tanaka_buy);
    document.getElementById("updated").textContent =
      `最終取得: ${data.last_updated_jst} / ${data.source_label}`;
    calculate();
  }catch(e){
    document.getElementById("basePrice").textContent = "取得失敗";
    document.getElementById("updated").className = "updated error";
    document.getElementById("updated").textContent = "価格データを読み込めませんでした。公式ページをご確認ください。";
  }
}
document.getElementById("purity").addEventListener("change", calculate);
document.getElementById("weight").addEventListener("input", calculate);
load();
</script>
</body>
</html>
